name: Request count

# Once a day, counts the requests the account's Workers and Pages Functions
# answered in the last day. The free plan allows 100,000 a day for the whole
# account, not per Worker, and the event hook makes each save two requests.
# Over WARN_AT this job fails, so GitHub emails the repo owner before the
# limit is reached.
#
# Needs the repo secret CLOUDFLARE_ANALYTICS_TOKEN: a Cloudflare API token
# with only "Account Analytics: Read".

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count the requests of the last 24 hours
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > count.mjs <<'EOF'
          const WARN_AT = 80000;
          const DAY_MS = 24 * 60 * 60 * 1000;

          const token = process.env.CLOUDFLARE_ANALYTICS_TOKEN;
          if (!token) throw new Error('The CLOUDFLARE_ANALYTICS_TOKEN secret is not set.');

          const since = new Date(Date.now() - DAY_MS).toISOString();
          const query = `{ viewer { accounts(filter: { accountTag: "${process.env.CLOUDFLARE_ACCOUNT_ID}" }) {
            workersInvocationsAdaptive(limit: 100, filter: { datetime_geq: "${since}" }) {
              sum { requests } dimensions { scriptName } }
            pagesFunctionsInvocationsAdaptiveGroups(limit: 100, filter: { datetime_geq: "${since}" }) {
              sum { requests } } } } }`;

          const res = await fetch('https://api.cloudflare.com/client/v4/graphql', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query }),
          });
          const body = await res.json();
          if (!res.ok || body.errors) {
            throw new Error(`Cloudflare query failed (${res.status}): ${JSON.stringify(body.errors)}`);
          }

          const account = body.data.viewer.accounts[0];
          const sum = groups => groups.reduce((total, g) => total + g.sum.requests, 0);
          for (const g of account.workersInvocationsAdaptive) {
            console.log(`${g.dimensions.scriptName}: ${g.sum.requests}`);
          }
          const functions = sum(account.pagesFunctionsInvocationsAdaptiveGroups);
          console.log(`Pages Functions: ${functions}`);
          const total = sum(account.workersInvocationsAdaptive) + functions;
          console.log(`Total: ${total} of a ${WARN_AT} warning line`);
          if (total > WARN_AT) {
            console.log(`::error::${total} requests in the last 24 hours, over ${WARN_AT}.`);
            process.exit(1);
          }
          EOF
          node count.mjs
