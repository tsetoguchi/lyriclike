name: Deploy the live-editing room

# Deploys collab/, the room Worker, when anything it is built from changes,
# once the tests pass: main goes to production, any other branch to the
# preview room. Every deploy restarts every room and drops every socket;
# open tabs reconnect without losing words (plans/live-co-editing.md §3).
# The room accepts the previous wire protocol too, so the site and the room
# may deploy in either order.
#
# Needs the repo secret CLOUDFLARE_WORKERS_TOKEN: a Cloudflare API token made
# from the "Edit Cloudflare Workers" template, for this account only, and
# the repo variable CLOUDFLARE_ACCOUNT_ID (kept out of the repo).

on:
  push:
    paths:
      - 'collab/**'
      - 'live-core.js'
      - 'functions/_event-hook.js'
      - '.github/workflows/collab-deploy.yml'
  workflow_dispatch:

# One deploy per room at a time, finished in order.
concurrency:
  group: collab-deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix collab
      - run: node --test "test/*.test.mjs"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix collab
      - name: Deploy the room
        working-directory: collab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            npx --yes wrangler@4.131.2 deploy
          else
            npx --yes wrangler@4.131.2 deploy --env preview
          fi
