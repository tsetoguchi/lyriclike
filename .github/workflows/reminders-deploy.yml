name: Deploy the reminders Worker

# Deploys reminders/, the daily "your song is waiting" email, when anything it
# is built from changes on main, once the tests pass. It has no preview copy:
# its cron would email real people from the preview database's accounts.
#
# Uses the same repo secret and variable as the room's deploy:
# CLOUDFLARE_WORKERS_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - 'reminders/**'
      - 'functions/_reminders.js'
      - 'functions/_email.js'
      - 'functions/_ratelimit.js'
      - 'functions/_shared.js'
      - '.github/workflows/reminders-deploy.yml'
  workflow_dispatch:

concurrency:
  group: reminders-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix collab
      - run: node --test "test/*.test.mjs"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the reminders Worker
        working-directory: reminders
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.2 deploy
