<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LyricLike</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141922">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LyricLike">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-content">
  <header>
    <h1>LyricLike</h1>
    <button id="syllable-toggle" class="toggle-btn"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span class="nav-label">Syllables</span></button>
    <button id="rhyme-scheme-toggle" class="toggle-btn"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="8" x2="15" y2="8"/><circle cx="19" cy="8" r="2"/><line x1="4" y1="16" x2="15" y2="16"/><circle cx="19" cy="16" r="2"/></svg><span class="nav-label">Rhyme Scheme</span></button>
    <button id="notebook-btn" class="toggle-btn"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="13" height="18" rx="2"/><line x1="10" y1="3" x2="10" y2="21"/></svg><span class="nav-label">My Notebook</span></button>
    <button id="create-btn" class="toggle-btn"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="nav-label">Create</span></button>
    <div class="header-right">
      <span id="status">Loading dictionary...</span>
      <div id="user-area">
        <button id="sign-in-btn" class="toggle-btn">Sign in</button>
        <span id="user-info" style="display:none">
          <span id="user-email"></span>
          <button id="account-settings-btn" class="toggle-btn">Account</button>
        </span>
      </div>
    </div>
  </header>
  <nav class="mobile-tabs" id="mobile-tabs">
    <button class="mobile-tab active" data-tab="lyrics">Lyrics</button>
    <button class="mobile-tab" data-tab="rhymes">Rhymes<span class="tab-word" id="tab-rhyme-word"></span></button>
  </nav>
  <div class="main">
    <div class="lyrics-panel">
      <div class="panel-header">
        <span id="lyrics-panel-title" contenteditable="true" spellcheck="false">Untitled</span>
        <span id="save-indicator"></span>
      </div>
      <div class="lyrics-area">
        <div class="syllable-gutter" id="syllable-gutter"></div>
        <div class="lyrics-wrapper">
          <div id="lyrics-highlight"></div>
          <textarea id="lyrics" placeholder="Start writing your lyrics here..."
                    autocomplete="off" autocorrect="on" autocapitalize="sentences"
                    spellcheck="false"></textarea>
        </div>
        <div class="rhyme-scheme-gutter" id="rhyme-scheme-gutter"></div>
        <div id="line-measure"></div>
      </div>
    </div>
    <div class="resize-handle" id="resize-handle"></div>
    <div class="rhymes-panel" id="rhymes-panel">
      <div class="selected-word-bar">
        <span class="label">Rhymes</span>
        <span class="word" id="selected-word"></span>
        <span class="context-line" id="selected-context"></span>
      </div>
      <div id="rhyme-results">
        <div class="empty-state">
          Select a word in the lyrics<br>to find rhymes
        </div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
  <div id="account-settings-overlay">
    <div id="account-settings-panel">
      <div class="account-settings-header">
        <span>Account</span>
        <button id="close-account-settings-btn" class="icon-btn">&#x2715;</button>
      </div>
      <div class="account-settings-body">
        <div class="settings-section">
          <div class="settings-row">
            <span class="settings-label">Email</span>
            <span id="settings-user-email" class="settings-value"></span>
          </div>
        </div>
        <div class="settings-section">
          <button id="settings-sign-out-btn" class="settings-btn">Sign out</button>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">Danger Zone</div>
          <button id="settings-delete-account-btn" class="settings-btn danger-btn">Delete Account</button>
          <p class="settings-hint">Permanently deletes your account and all saved lyrics.</p>
        </div>
      </div>
    </div>
  </div>
  <div id="dialog-overlay" hidden>
    <div id="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div id="dialog-header"><span id="dialog-title">New lyric</span></div>
      <div id="dialog-body">
        <p id="dialog-message" hidden></p>
        <div id="dialog-field">
          <label id="dialog-label" for="dialog-input">Title</label>
          <input id="dialog-input" type="text" maxlength="300"
                 autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
      </div>
      <div id="dialog-actions">
        <button id="dialog-cancel" class="toggle-btn">Cancel</button>
        <button id="dialog-confirm" class="toggle-btn">Create</button>
      </div>
    </div>
  </div>
  <div id="lyrics-list-overlay">
    <div id="lyrics-list-panel">
      <div id="lyrics-list-panel-header">
        <span>My Notebook</span>
        <button id="new-lyric-btn" class="icon-btn" aria-label="New lyric" title="New lyric">+</button>
        <button id="close-lyrics-list-btn" class="icon-btn">&#x2715;</button>
      </div>
      <div id="lyrics-list-items"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
</body>
</html>
