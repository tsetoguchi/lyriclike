# The live-editing room (plans/live-co-editing.md). The Pages site reaches it
# through its PAGE_ROOM binding. It has no public URL, because it trusts the
# X-Room-* headers that only that binding can send.
name = "lyricalmiracle-collab"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# Room events (joins, closes, merges) go to Workers Logs.
[observability]
enabled = true

[[durable_objects.bindings]]
name = "PAGE_ROOM"
class_name = "PageRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageRoom"]

[[d1_databases]]
binding = "lyricalmiracle_db"
database_name = "lyricalmiracle-db"
database_id = "581d1db7-8372-4f83-a375-693388712173"

[env.preview]
name = "lyricalmiracle-collab-preview"
workers_dev = false
preview_urls = false

[[env.preview.durable_objects.bindings]]
name = "PAGE_ROOM"
class_name = "PageRoom"

[[env.preview.d1_databases]]
binding = "lyricalmiracle_db"
database_name = "lyricalmiracle-db-preview"
database_id = "1f06dc81-fde4-46f4-b958-65d7b8bd13ef"
